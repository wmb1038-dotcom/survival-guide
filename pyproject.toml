[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awareness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "websockets>=12.0",
    "folium>=0.15.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
awareness = "awareness.cli:cli"

[tool.setuptools]
packages = ["awareness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
